name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish Windows
        run: dotnet publish -c Release -r win-x64 --self-contained -o ./publish/win-x64 -p:PublishSingleFile=false

      - name: Create ZIP
        run: Compress-Archive -Path ./publish/win-x64/* -DestinationPath ./publish/WeatherJuice-windows-x64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: ./publish/win-x64

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: ./publish/WeatherJuice-windows-x64.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish macOS x64
        run: dotnet publish -c Release -r osx-x64 --self-contained -o ./publish/osx-x64

      - name: Publish macOS arm64
        run: dotnet publish -c Release -r osx-arm64 --self-contained -o ./publish/osx-arm64

      - name: Create universal binary
        run: |
          mkdir -p ./publish/Universal
          lipo -create ./publish/osx-x64/WeathersnakeAvalonia ./publish/osx-arm64/WeathersnakeAvalonia -output ./publish/Universal/WeathersnakeAvalonia
          mkdir -p ./publish/Universal.app/Contents/MacOS
          cp ./publish/Universal/WeathersnakeAvalonia ./publish/Universal.app/Contents/MacOS/

      - name: Copy icon
        run: |
          mkdir -p ./publish/Universal.app/Contents/Resources
          cp Assets/logo.ico ./publish/Universal.app/Contents/Resources/WeathersnakeAvalonia.ico

      - name: Copy Info.plist
        run: |
          mkdir -p ./publish/Universal.app/Contents
          cp .github/workflows/Info.plist ./publish/Universal.app/Contents/Info.plist

      - name: Create PKG Installer
        run: |
          productbuild --component ./publish/Universal.app /Applications --product .github/workflows/Info.plist ./publish/WeatherJuice.pkg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: ./publish/Universal.app

      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: ./publish/WeatherJuice.pkg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish Linux
        run: dotnet publish -c Release -r linux-x64 --self-contained -o ./publish/linux-x64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: ./publish/linux-x64

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./artifacts/windows-zip/*.zip
            ./artifacts/macos-pkg/*.pkg
            ./artifacts/macos-universal/WeathersnakeAvalonia
            ./artifacts/linux-x64/WeathersnakeAvalonia
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}